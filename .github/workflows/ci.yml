name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - run: bun install --frozen-lockfile

      # Unit tests include the fee-drift guard, which reads FeeController.sol
      # from the public basquets/contracts repo.
      - run: bun test

      # biome check src && astro check && astro build
      - run: bun run check
